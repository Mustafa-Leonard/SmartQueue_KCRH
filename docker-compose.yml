version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartqueue_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartqueue_db
      POSTGRES_USER: smartqueue_user
      POSTGRES_PASSWORD: SmartQueue@2024!
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartqueue_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartqueue_user -d smartqueue_db']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartqueue_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kcrh.go.ke
      PGADMIN_DEFAULT_PASSWORD: Admin@2024
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - smartqueue_network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  smartqueue_network:
    driver: bridge
